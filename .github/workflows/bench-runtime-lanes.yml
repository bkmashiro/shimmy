name: Runtime Lane E2E Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wasm-backend
    paths:
      - .github/workflows/bench-runtime-lanes.yml
      - demo/compose/**
      - examples/eval-python/**
      - examples/eval-pyodide/**
      - experiments/qemu-fallback/**
      - internal/execution/supervisor/**
      - internal/execution/wasm/**
      - scripts/benchmark-runtime-lanes.py
      - scripts/benchmark-runtime-comparison-bridge.py
      - scripts/tests/test_benchmark_runtime_lanes.py
      - scripts/tests/test_benchmark_runtime_comparison_bridge.py
      - scripts/tests/test_benchmark_qemu_rpc_hot_reset.py
      - experiments/runtime-comparison-bridge/**
      - build/python-reactor/**

permissions:
  contents: read

concurrency:
  group: runtime-lane-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-lanes:
    name: Generic / Agent Python COW / Pyodide / DBI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SHIMMY_DEMO_IMAGE_PREFIX: shimmy-bench
      SHIMMY_DEMO_TAG: ci
      SHIMMY_DEMO_VERSION: bench-${{ github.run_number }}
      SHIMMY_DEMO_COMMIT: ${{ github.sha }}
      SHIMMY_DEMO_INCLUDE_DBI: "1"
      SHIMMY_BRIDGE_IMAGE_PREFIX: shimmy-bridge
      SHIMMY_BRIDGE_TAG: ci
      SHIMMY_BRIDGE_VERSION: bridge-${{ github.run_number }}
      SHIMMY_BRIDGE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Pull the pinned external runtime artifact
        run: git lfs pull --include="build/python-reactor/artifacts/agent-python-runtime-numpy-core.wasm" --exclude=""

      - name: Prove Agent Python snapshot, COW, and single-use lifecycles
        run: scripts/smoke-python-reactor-handoff.sh direct

      - name: Validate benchmark contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            scripts.tests.test_benchmark_runtime_lanes \
            scripts.tests.test_benchmark_runtime_comparison_bridge \
            experiments.runtime-comparison-bridge.test_bridge -v
          npm --prefix examples/eval-pyodide test
          go test ./experiments/runtime-comparison-bridge/contract \
            ./experiments/runtime-comparison-bridge/native-file
          docker compose --profile dbi -f demo/compose/compose.yaml config --quiet
          docker compose --profile dbi -f experiments/runtime-comparison-bridge/compose.yaml config --quiet

      - name: Record runner environment
        run: |
          mkdir -p artifacts/runtime-lane-bench
          {
            uname -a
            lscpu
            docker version
            docker compose version
          } > artifacts/runtime-lane-bench/compose-env.txt

      - name: Build runtime lane images
        run: |
          docker compose --profile dbi -f demo/compose/compose.yaml build \
            generic python-reactor pyodide-scipy dbi-lean

      - name: Build declared comparison bridge images
        run: |
          docker compose --profile dbi -f experiments/runtime-comparison-bridge/compose.yaml build \
            bridge-system-native bridge-system-generic \
            bridge-python-native-fresh bridge-python-native-persistent \
            bridge-python-agent-cow bridge-python-pyodide-persistent

      - name: Benchmark public HTTP lifecycle phases
        run: |
          python3 scripts/benchmark-runtime-lanes.py \
            --compose-file demo/compose/compose.yaml \
            --warmups 2 \
            --samples 10 \
            --output artifacts/runtime-lane-bench/compose-lanes.json

      - name: Benchmark declared comparison edges
        run: |
          python3 scripts/benchmark-runtime-comparison-bridge.py \
            --compose-file experiments/runtime-comparison-bridge/compose.yaml \
            --warmups 2 \
            --samples 10 \
            --output artifacts/runtime-lane-bench/comparison-bridge.json

      - name: Capture failure logs
        if: failure()
        run: |
          docker compose --profile dbi -f demo/compose/compose.yaml \
            logs --no-color > artifacts/runtime-lane-bench/compose-failure.log 2>&1 || true
          docker compose --profile dbi -f experiments/runtime-comparison-bridge/compose.yaml \
            logs --no-color > artifacts/runtime-lane-bench/comparison-bridge-failure.log 2>&1 || true

      - name: Upload compose-lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-lanes-compose-${{ github.sha }}
          path: artifacts/runtime-lane-bench/
          if-no-files-found: error
          retention-days: 90

  qemu-tcg:
    name: QEMU TCG fresh-VM file profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QEMU and guest image tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            busybox-static \
            dracut-core \
            squashfs-tools \
            linux-image-virtual \
            qemu-system-x86 \
            qemu-utils

      - name: Resolve boot artifacts
        run: |
          kernel=$(readlink -f /boot/vmlinuz)
          test -f "$kernel"
          sudo chmod a+r "$kernel"
          printf 'KERNEL_PATH=%s\n' "$kernel" >> "$GITHUB_ENV"

      - name: Validate benchmark contract and runner
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            scripts.tests.test_benchmark_runtime_lanes \
            scripts.tests.test_benchmark_runtime_comparison_bridge \
            scripts.tests.test_benchmark_qemu_rpc_hot_reset -v
          bash -n experiments/qemu-fallback/benchmark-ci-file.sh

      - name: Record runner environment
        run: |
          mkdir -p artifacts/runtime-lane-bench
          {
            go version
            uname -a
            lscpu
            qemu-system-x86_64 --version
          } > artifacts/runtime-lane-bench/qemu-env.txt

      - name: Build manifest-bound guest fixture
        env:
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BUILD_DIR: ${{ runner.temp }}/qemu-runtime-lane-image
          KERNEL_PATH: ${{ env.KERNEL_PATH }}
          FILE_EVALUATOR_PACKAGE: ./experiments/runtime-comparison-bridge/native-file
          FILE_EVALUATOR_ID: system-bridge-v1
        run: experiments/qemu-fallback/build-image.sh

      - name: Benchmark native and QEMU public HTTP requests
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BIN_DIR: ${{ runner.temp }}/qemu-runtime-lane-bench
          OUTPUT: ${{ github.workspace }}/artifacts/runtime-lane-bench/qemu-file.json
          REQUEST_COUNT: "3"
          FILE_EVALUATOR_PACKAGE: ./experiments/runtime-comparison-bridge/native-file
          FILE_EVALUATOR_ID: system-bridge-v1
        run: experiments/qemu-fallback/benchmark-ci-file.sh

      - name: Benchmark QEMU RPC prewarm effectiveness and lazy reset
        run: |
          experiments/qemu-fallback/benchmark-ci-rpc-prewarm.py \
            --artifact-dir "${{ github.workspace }}/artifacts/qemu-fallback" \
            --bin-dir "${{ runner.temp }}/qemu-runtime-lane-bench" \
            --output "${{ github.workspace }}/artifacts/runtime-lane-bench/qemu-rpc-prewarm.json" \
            --repeated-count 3 \
            --eager-interarrival-seconds 30

      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-lanes-qemu-${{ github.sha }}
          path: |
            artifacts/runtime-lane-bench/
            artifacts/qemu-fallback/manifest.json
            artifacts/qemu-fallback/file-evaluator-manifest.json
            ${{ runner.temp }}/qemu-runtime-lane-bench/*.log
          if-no-files-found: error
          retention-days: 90
