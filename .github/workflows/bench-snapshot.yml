name: Shimmy Sandbox Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Full Linux sandbox benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -o pipefail {0}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: sudo apt-get install -y gcc libc6-dev

      - name: Enable and record userfaultfd environment
        run: |
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          {
            go version
            uname -a
            lscpu
            printf 'vm.unprivileged_userfaultfd='
            cat /proc/sys/vm/unprivileged_userfaultfd
          } | tee bench-env.txt

      - name: Validate benchmark evidence contract
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/execution/wasm \
            -run='TestLargeRestoreBenchmarkPlan|TestDirtyPageRanges|TestUffdStrategyDirtyPageCountReportsTrackedBits' \
            -count=1 -v

      - name: Benchmark subprocess RPC baselines
        run: |
          go test -run='^$' \
            -bench='^BenchmarkSubprocessRPC_Echo' \
            -benchtime=2s -count=5 -timeout=1800s -benchmem \
            ./internal/execution/ | tee bench-subprocess.txt

      - name: Benchmark generic WASM dispatcher and restore strategies
        env:
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' \
            -bench='^(BenchmarkDispatcher_Send_|BenchmarkSnapshotRestore_)' \
            -benchtime=2s -count=5 -timeout=1800s -benchmem \
            ./internal/execution/wasm/ | tee bench-wasm-runtime.txt

      - name: Benchmark Linux COW reset against full copy
        env:
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' \
            -bench='^BenchmarkCowVsFullCopyResetOnly$' \
            -benchtime=2s -count=5 -timeout=1800s -benchmem \
            ./internal/execution/wasm/ | tee bench-cow.txt

      - name: Benchmark large-memory restore and UFFD phases
        env:
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' \
            -bench='^(BenchmarkLargeMemoryRestore|BenchmarkUffdLargeMemoryPhases)$' \
            -benchtime=1x -count=3 -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-large.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshot-bench-${{ github.sha }}
          path: bench-*.txt
          retention-days: 90
