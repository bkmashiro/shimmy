name: Snapshot Strategy Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: large
        type: choice
        options:
          - large
          - full
  push:
    branches:
      - feat/wasm-backend
    paths:
      - "internal/execution/wasm/snapshot_large_bench*_test.go"
      - "internal/execution/wasm/snapshot_uffd_linux.go"
      - "internal/execution/wasm/snapshot_uffd_metrics_linux_test.go"
      - ".github/workflows/bench-snapshot.yml"

jobs:
  bench:
    name: Benchmark (bare Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -o pipefail {0}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: sudo apt-get install -y gcc libc6-dev

      - name: Enable and record userfaultfd environment
        run: |
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          {
            go version
            uname -a
            lscpu
            printf 'vm.unprivileged_userfaultfd='
            cat /proc/sys/vm/unprivileged_userfaultfd
          } | tee bench-env.txt

      - name: Validate benchmark evidence contract
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/execution/wasm \
            -run='TestLargeRestoreBenchmarkPlan|TestDirtyPageRanges|TestUffdStrategyDirtyPageCountReportsTrackedBits' \
            -count=1 -v

      - name: Benchmark large-memory restore and UFFD phases
        env:
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' \
            -bench='^(BenchmarkLargeMemoryRestore|BenchmarkUffdLargeMemoryPhases)$' \
            -benchtime=1x -count=3 -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-large.txt

      - name: Download python-reactor.wasm
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        run: |
          curl -fsSL \
            "https://github.com/bkmashiro/shimmy-wasm-go/releases/download/wasm-artifacts/python-reactor.wasm" \
            -o python-reactor.wasm
          ls -lh python-reactor.wasm

      - name: BenchmarkRestoreNPages
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' -bench=BenchmarkRestoreNPages \
            -benchtime=10s -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-dirty.txt

      - name: BenchmarkStrategy
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' -bench=BenchmarkStrategy \
            -benchtime=20s -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-strategy.txt

      - name: BenchmarkPool
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' -bench=BenchmarkPool \
            -benchtime=15s -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-pool.txt

      - name: BenchmarkTakeOnly and BenchmarkRestoreOnly
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          CGO_ENABLED: "1"
        run: |
          go test -run='^$' -bench='BenchmarkTakeOnly|BenchmarkRestoreOnly' \
            -benchtime=10s -timeout=3600s -benchmem \
            ./internal/execution/wasm/ | tee bench-isolate.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snapshot-bench-${{ github.sha }}
          path: bench-*.txt
          retention-days: 90
