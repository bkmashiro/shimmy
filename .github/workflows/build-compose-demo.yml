name: Build compact demo images

on:
  push:
    branches:
      - feat/wasm-backend
    paths:
      - .dockerignore
      - .github/workflows/build-compose-demo.yml
      - demo/compose/**
      - scripts/smoke-compose-demo.sh
      - examples/demo-stateful/main.go
      - examples/eval-python/eval.py
      - examples/eval-pyodide/**
      - examples/eval-scipy/eval.py
      - go.mod
      - go.sum
      - "**/*.go"
  workflow_dispatch:
    inputs:
      push_images:
        description: Push verified images to Docker Hub
        required: true
        default: false
        type: boolean
      tag:
        description: Docker image tag
        required: true
        default: edge
        type: string

permissions:
  contents: read

concurrency:
  group: compact-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: Build and smoke all lanes (native amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SHIMMY_DEMO_IMAGE_PREFIX: shimmy-demo
      SHIMMY_DEMO_TAG: ci
      SHIMMY_DEMO_VERSION: demo-${{ github.run_number }}
      SHIMMY_DEMO_COMMIT: ${{ github.sha }}
      SHIMMY_DEMO_INCLUDE_DBI: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f demo/compose/compose.yaml config --quiet

      - name: Build compact images
        run: >-
          docker compose -f demo/compose/compose.yaml build
          generic python-reactor pyodide-scipy dbi-lean

      - name: Run full HTTP smoke
        run: scripts/smoke-compose-demo.sh --no-build

  publish:
    name: Publish ${{ matrix.suffix }}
    if: ${{ inputs.push_images }}
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: generic
            suffix: generic
            platforms: linux/amd64,linux/arm64
          - target: python-reactor
            suffix: python-reactor
            platforms: linux/amd64,linux/arm64
          - target: pyodide-scipy
            suffix: pyodide-scipy
            platforms: linux/amd64,linux/arm64
          - target: dbi-lean
            suffix: dbi-lean
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demo/compose/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VERSION=demo-${{ github.run_number }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shimmy-demo-${{ matrix.suffix }}:${{ inputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shimmy-demo-${{ matrix.suffix }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=compact-demo-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=compact-demo-${{ matrix.suffix }}
