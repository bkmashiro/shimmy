name: Build WASM Examples

on:
  push:
    paths:
      - "examples/**"
    branches:
      - main
      - feat/wasm-backend
  pull_request:
    paths:
      - "examples/**"
  workflow_dispatch:

jobs:
  build-rust:
    name: Build eval-rust (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/eval-rust/target
          key: cargo-wasm-${{ hashFiles('examples/eval-rust/Cargo.toml') }}

      - name: Build
        working-directory: examples/eval-rust
        run: cargo build --target wasm32-wasip1 --release

      - name: Copy artifact
        working-directory: examples/eval-rust
        run: cp target/wasm32-wasip1/release/eval_rust.wasm eval.wasm

      - name: Upload eval.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-rust.wasm
          path: examples/eval-rust/eval.wasm

  build-c-cpp:
    name: Build eval-c and eval-cpp (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "25"
      WASI_SDK_PATH: /opt/wasi-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Cache WASI-SDK
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-linux

      - name: Install WASI-SDK
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz \
            | tar -xz -C /opt
          mv /opt/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux /opt/wasi-sdk

      - name: Build eval-c
        working-directory: examples/eval-c
        run: make WASI_SDK=${{ env.WASI_SDK_PATH }}

      - name: Build eval-cpp
        working-directory: examples/eval-cpp
        run: make WASI_SDK=${{ env.WASI_SDK_PATH }}

      - name: Upload eval-c.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-c.wasm
          path: examples/eval-c/eval.wasm

      - name: Upload eval-cpp.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-cpp.wasm
          path: examples/eval-cpp/eval.wasm

  smoke-test:
    name: Smoke-test WASM examples
    runs-on: ubuntu-latest
    needs: [build-rust, build-c-cpp]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Download eval-rust.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-rust.wasm
          path: examples/eval-rust

      - name: Download eval-c.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-c.wasm
          path: examples/eval-c

      - name: Download eval-cpp.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-cpp.wasm
          path: examples/eval-cpp

      - name: Run smoke tests
        run: go test ./examples/... -v -timeout 60s
