name: Build WASM Examples

on:
  push:
    paths:
      - "examples/**"
    branches:
      - main
      - feat/wasm-backend
  pull_request:
    paths:
      - "examples/**"
  workflow_dispatch:

jobs:
  build-rust:
    name: Build eval-rust (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/eval-rust/target
          key: cargo-wasm-${{ hashFiles('examples/eval-rust/Cargo.toml') }}

      - name: Build
        working-directory: examples/eval-rust
        run: cargo build --target wasm32-wasip1 --release

      - name: Copy artifact
        working-directory: examples/eval-rust
        run: cp target/wasm32-wasip1/release/eval_rust.wasm eval.wasm

      - name: Upload eval.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-rust.wasm
          path: examples/eval-rust/eval.wasm

  build-c-cpp:
    name: Build eval-c and eval-cpp (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "25"
      WASI_SDK_PATH: /opt/wasi-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Cache WASI-SDK
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-linux

      - name: Install WASI-SDK
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz \
            | tar -xz -C /opt
          mv /opt/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux /opt/wasi-sdk

      - name: Build eval-c
        working-directory: examples/eval-c
        run: make WASI_SDK=${{ env.WASI_SDK_PATH }}

      - name: Build eval-cpp
        working-directory: examples/eval-cpp
        run: make WASI_SDK=${{ env.WASI_SDK_PATH }}

      - name: Upload eval-c.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-c.wasm
          path: examples/eval-c/eval.wasm

      - name: Upload eval-cpp.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-cpp.wasm
          path: examples/eval-cpp/eval.wasm

  build-adversarial:
    name: Build adversarial WASM modules (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Build mem-bomb
        working-directory: examples/adversarial/mem-bomb
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build cpu-bomb
        working-directory: examples/adversarial/cpu-bomb
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build stack-bomb
        working-directory: examples/adversarial/stack-bomb
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build fs-read-environ
        working-directory: examples/adversarial/fs-read-environ
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build fs-read-etc
        working-directory: examples/adversarial/fs-read-etc
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build fs-write-tmp
        working-directory: examples/adversarial/fs-write-tmp
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build net-tcp
        working-directory: examples/adversarial/net-tcp
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build env-read
        working-directory: examples/adversarial/env-read
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build fork-exec
        working-directory: examples/adversarial/fork-exec
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build large-output
        working-directory: examples/adversarial/large-output
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build memory-grow
        working-directory: examples/adversarial/memory-grow
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Build concurrent-isolation
        working-directory: examples/adversarial/concurrent-isolation
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Upload adversarial-mem-bomb.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-mem-bomb.wasm
          path: examples/adversarial/mem-bomb/eval.wasm

      - name: Upload adversarial-cpu-bomb.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-cpu-bomb.wasm
          path: examples/adversarial/cpu-bomb/eval.wasm

      - name: Upload adversarial-stack-bomb.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-stack-bomb.wasm
          path: examples/adversarial/stack-bomb/eval.wasm

      - name: Upload adversarial-fs-read-environ.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-fs-read-environ.wasm
          path: examples/adversarial/fs-read-environ/eval.wasm

      - name: Upload adversarial-fs-read-etc.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-fs-read-etc.wasm
          path: examples/adversarial/fs-read-etc/eval.wasm

      - name: Upload adversarial-fs-write-tmp.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-fs-write-tmp.wasm
          path: examples/adversarial/fs-write-tmp/eval.wasm

      - name: Upload adversarial-net-tcp.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-net-tcp.wasm
          path: examples/adversarial/net-tcp/eval.wasm

      - name: Upload adversarial-env-read.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-env-read.wasm
          path: examples/adversarial/env-read/eval.wasm

      - name: Upload adversarial-fork-exec.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-fork-exec.wasm
          path: examples/adversarial/fork-exec/eval.wasm

      - name: Upload adversarial-large-output.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-large-output.wasm
          path: examples/adversarial/large-output/eval.wasm

      - name: Upload adversarial-memory-grow.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-memory-grow.wasm
          path: examples/adversarial/memory-grow/eval.wasm

      - name: Upload adversarial-concurrent-isolation.wasm
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-concurrent-isolation.wasm
          path: examples/adversarial/concurrent-isolation/eval.wasm

  build-js:
    name: Build eval-js (javy/QuickJS → wasm32-wasi)
    runs-on: ubuntu-latest
    env:
      JAVY_VERSION: "8.1.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Install javy
        run: |
          curl -fsSL https://github.com/bytecodealliance/javy/releases/download/v${{ env.JAVY_VERSION }}/javy-x86_64-linux-v${{ env.JAVY_VERSION }}.gz \
            | gunzip > /usr/local/bin/javy
          chmod +x /usr/local/bin/javy

      - name: Install wazero CLI
        run: go install github.com/tetratelabs/wazero/cmd/wazero@latest

      - name: Build runner.wasm
        working-directory: examples/eval-js
        run: ./build-runner.sh

      - name: Upload eval-js-runner.wasm
        uses: actions/upload-artifact@v4
        with:
          name: eval-js-runner.wasm
          path: examples/eval-js/runner.wasm

  smoke-test:
    name: Smoke-test WASM examples
    runs-on: ubuntu-latest
    needs: [build-rust, build-c-cpp, build-adversarial, build-js]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Install wazero CLI
        run: go install github.com/tetratelabs/wazero/cmd/wazero@latest

      - name: Download eval-rust.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-rust.wasm
          path: examples/eval-rust

      - name: Download eval-c.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-c.wasm
          path: examples/eval-c

      - name: Download eval-cpp.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-cpp.wasm
          path: examples/eval-cpp

      - name: Download adversarial-mem-bomb.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-mem-bomb.wasm
          path: examples/adversarial/mem-bomb

      - name: Download adversarial-cpu-bomb.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-cpu-bomb.wasm
          path: examples/adversarial/cpu-bomb

      - name: Download adversarial-stack-bomb.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-stack-bomb.wasm
          path: examples/adversarial/stack-bomb

      - name: Download adversarial-fs-read-environ.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-fs-read-environ.wasm
          path: examples/adversarial/fs-read-environ

      - name: Download adversarial-fs-read-etc.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-fs-read-etc.wasm
          path: examples/adversarial/fs-read-etc

      - name: Download adversarial-fs-write-tmp.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-fs-write-tmp.wasm
          path: examples/adversarial/fs-write-tmp

      - name: Download adversarial-net-tcp.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-net-tcp.wasm
          path: examples/adversarial/net-tcp

      - name: Download adversarial-env-read.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-env-read.wasm
          path: examples/adversarial/env-read

      - name: Download adversarial-fork-exec.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-fork-exec.wasm
          path: examples/adversarial/fork-exec

      - name: Download adversarial-large-output.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-large-output.wasm
          path: examples/adversarial/large-output

      - name: Download adversarial-memory-grow.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-memory-grow.wasm
          path: examples/adversarial/memory-grow

      - name: Download adversarial-concurrent-isolation.wasm
        uses: actions/download-artifact@v4
        with:
          name: adversarial-concurrent-isolation.wasm
          path: examples/adversarial/concurrent-isolation

      - name: Download eval-js-runner.wasm
        uses: actions/download-artifact@v4
        with:
          name: eval-js-runner.wasm
          path: examples/eval-js

      - name: Run smoke tests
        run: go test ./examples/... -v -timeout 120s
