name: COW Prepared Memory

on:
  push:
    branches:
      - feat/wasm-backend
    paths:
      - "internal/execution/**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/cow-memory.yml"
  pull_request:
    paths:
      - "internal/execution/**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/cow-memory.yml"
  workflow_dispatch:
    inputs:
      python_reactor:
        description: Download the pinned Python reactor and run the heavy prepared-baseline proof
        required: true
        default: false
        type: boolean
      mechanism_evidence:
        description: Record reset-only RSS/PSS, page-fault, COW/full-copy, and optional UFFD mechanism evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cow-linux:
    name: COW correctness (bare Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run focused COW correctness tests
        run: |
          go test ./internal/execution/wasm \
            -run='^(TestCow|TestReactorPython(PoolSize|InitConcurrency|Flyweight|DispatcherPartialStart)|TestBorrowedReactorPythonRunner)' \
            -count=1 -v -timeout=120s

      - name: Run full Linux test suite
        run: go test ./... -count=1 -timeout=15m

  python-reactor-cow:
    name: Python reactor prepared-image proof
    if: github.event_name == 'workflow_dispatch' && inputs.python_reactor
    needs: cow-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download pinned Python reactor artifact
        run: |
          curl -fsSL \
            "https://github.com/bkmashiro/webassembly-language-runtimes/releases/download/v1.0.14/python-reactor.wasm" \
            -o python-reactor.wasm
          echo "78dcbb6d673351c0d3b776c42d2fb93b6f638cdc714d58072dece4b115edaa72  python-reactor.wasm" \
            | sha256sum --check
          sha256sum python-reactor.wasm | tee python-reactor.sha256

      - name: Run prepared-baseline and repeated-state proof
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          COW_EVIDENCE_PATH: ${{ github.workspace }}/cow-python-evidence.json
        run: |
          go test ./internal/execution/wasm \
            -run='^TestCowPythonReactorPreparedBaselines$' \
            -count=1 -v -timeout=30m 2>&1 | tee cow-python-test.log

      - name: Record shared-runtime density at N=1/2/4/8
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
          COW_DENSITY_CACHE_DIR: ${{ runner.temp }}/wazero-density-cache
        run: |
          for instances in 1 2 4 8; do
            COW_DENSITY_INSTANCES="$instances" \
            COW_DENSITY_EVIDENCE_PATH="${GITHUB_WORKSPACE}/cow-python-density-${instances}.json" \
              go test ./internal/execution/wasm \
                -run='^TestCowPythonReactorFlyweightDensity$' \
                -count=1 -v -timeout=30m \
                2>&1 | tee "cow-python-density-${instances}.log"
          done

      - name: Compare complete prepared request latency
        env:
          PYTHON_REACTOR_WASM: ${{ github.workspace }}/python-reactor.wasm
        run: |
          go test ./internal/execution/wasm \
            -run='^$' -bench='^BenchmarkCowPythonPreparedFullRequest$' \
            -benchtime=5x -count=1 -benchmem -timeout=30m \
            2>&1 | tee cow-python-benchmark.log

      - name: Upload prepared-image evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cow-python-${{ github.sha }}
          path: |
            python-reactor.sha256
            cow-python-evidence.json
            cow-python-test.log
            cow-python-density-*.json
            cow-python-density-*.log
            cow-python-benchmark.log
          if-no-files-found: warn
          retention-days: 90

  mechanism-evidence:
    name: COW mechanism evidence (reset-only)
    if: github.event_name == 'workflow_dispatch' && inputs.mechanism_evidence
    needs: cow-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Record RSS/PSS, faults, and strategy availability
        env:
          COW_MECHANISM_EVIDENCE_PATH: ${{ github.workspace }}/cow-mechanism-evidence.json
        run: |
          go test ./internal/execution/wasm \
            -run='^TestCowLinuxMechanismEvidence$' \
            -count=1 -v -timeout=10m 2>&1 | tee cow-mechanism-test.log

      - name: Compare reset mechanisms without end-to-end claims
        run: |
          go test ./internal/execution/wasm \
            -run='^$' -bench='^BenchmarkCowVsFullCopyResetOnly$' \
            -benchtime=3x -count=1 -benchmem -timeout=10m \
            2>&1 | tee cow-reset-benchmark.log

      - name: Upload mechanism evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cow-mechanism-${{ github.sha }}
          path: |
            cow-mechanism-evidence.json
            cow-mechanism-test.log
            cow-reset-benchmark.log
          if-no-files-found: warn
          retention-days: 90
