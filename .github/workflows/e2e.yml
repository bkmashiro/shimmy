name: End-to-End Tests

on:
  push:
    branches:
      - main
      - feat/wasm-backend
    paths:
      - "main.go"
      - "app/**"
      - "cmd/**"
      - "handler/**"
      - "internal/server/**"
      - "internal/execution/dispatcher*.go"
      - "internal/execution/wasm/**"
      - "runtime/**"
      - "examples/demo-stateful/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "main.go"
      - "app/**"
      - "cmd/**"
      - "handler/**"
      - "internal/server/**"
      - "internal/execution/dispatcher*.go"
      - "internal/execution/wasm/**"
      - "runtime/**"
      - "examples/demo-stateful/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e-wasm-go:
    name: E2E / generic WASM state reset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Install Dependencies
        run: go mod download

      - name: Build shimmy
        run: go build -o /tmp/shimmy .

      - name: Build stateful WASM module
        working-directory: examples/demo-stateful
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o eval.wasm .

      - name: Start shimmy (WASM backend)
        env:
          FUNCTION_INTERFACE: wasm
          FUNCTION_WASM_MODULE: ${{ github.workspace }}/examples/demo-stateful/eval.wasm
          LOG_LEVEL: info
        run: /tmp/shimmy serve --port 18080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18080/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:18080/health || (echo "Server did not start" && exit 1)

      - name: Health check
        run: |
          RESP=$(curl -sf http://localhost:18080/health)
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'expected status=ok, got {d}'
          print('PASS: health check')
          "

      - name: Eval — repeated requests restore guest memory
        run: |
          for request in 1 2; do
            RESP=$(curl -sf -X POST http://localhost:18080/ \
              -H 'Content-Type: application/json' \
              -d '{"response":"hello","answer":"hello"}')
            echo "Response ${request}: $RESP"
            RESP="$RESP" python3 -c 'import json, os; result=json.loads(os.environ["RESP"]); result=result.get("result", result); assert result.get("is_correct") is True, result; assert result.get("guest_invocation_count") == 1, result; assert result.get("snapshot_isolation_ok") is True, result'
          done
          echo "PASS: both requests observed the post-startup baseline"

      - name: Eval — incorrect answer
        run: |
          RESP=$(curl -sf -X POST http://localhost:18080/ \
            -H 'Content-Type: application/json' \
            -d '{"response":"hello","answer":"world"}')
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          result = d.get('result', d)
          assert result.get('is_correct') == False, f'expected is_correct=false, got {result}'
          print('PASS: incorrect answer returns is_correct=false')
          "

      - name: Preview method
        run: |
          RESP=$(curl -sf -X POST http://localhost:18080/ \
            -H 'Content-Type: application/json' \
            -H 'Command: preview' \
            -d '{"response":"hello","answer":"world"}')
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          result = d.get('result', d)
          # preview should return a result (not an error)
          assert 'error' not in d or d.get('result') is not None, f'preview returned error: {d}'
          print('PASS: preview method dispatched without error')
          "

      - name: Healthcheck method
        run: |
          RESP=$(curl -sf -X POST http://localhost:18080/ \
            -H 'Content-Type: application/json' \
            -H 'Command: healthcheck' \
            -d '{"response":"x","answer":"x"}')
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          result = d.get('result', d)
          assert result.get('status') == 'ok', f'expected healthcheck status=ok, got {result}'
          print('PASS: healthcheck returns status=ok')
          "
