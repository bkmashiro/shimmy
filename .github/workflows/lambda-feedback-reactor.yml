name: Frozen Legacy Reactor Bundle Matrix (manual)

on:
  workflow_dispatch:
    inputs:
      reactor_version:
        description: "Frozen legacy artifact version; non-authoritative until reactor handoff"
        required: true
        default: "v1.0.11"
      mode:
        description: "Runner mode for scripts/demo-reactor-lambda-feedback-bundles.sh"
        required: true
        default: "docker"
        type: choice
        options:
          - docker
          - local

jobs:
  lambda-feedback-reactor:
    name: Frozen legacy reactor evidence (non-authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Run Lambda Feedback reactor bundle matrix
        env:
          SHIMMY_REACTOR_VERSION: ${{ inputs.reactor_version }}
        run: scripts/demo-reactor-lambda-feedback-bundles.sh "${{ inputs.mode }}"
