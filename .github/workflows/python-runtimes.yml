name: Python Runtime Routes

on:
  push:
    branches:
      - main
      - feat/wasm-backend
    paths:
      - "examples/eval-scipy/**"
      - "examples/eval-python/**"
      - "examples/eval-pyodide/**"
      - "examples/lambda-feedback-adapter/**"
      - "examples/lambda-feedback-fixtures/**"
      - "scripts/demo-python-examples.sh"
      - "scripts/smoke-python-reactor-handoff.sh"
      - "scripts/verify-python-reactor-artifact.sh"
      - "scripts/python-reactor-artifact.env"
      - "scripts/smoke-pyodide-package-http.sh"
      - "scripts/python-runtime-handoff/**"
      - "tools/lf-bundle-python/**"
      - "build/python-reactor/artifacts/**"
      - "docs/python-runtime-handoff.md"
      - "docs/lambda-feedback-handoff.md"
      - "docs/README.md"
      - "internal/execution/dispatcher*.go"
      - "internal/execution/wasm/agent_python*.go"
      - "internal/execution/wasm/config.go"
      - "internal/execution/supervisor/adapter_rpc*.go"
      - "internal/execution/worker/**"
      - "handler/**"
      - "runtime/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/python-runtimes.yml"
  pull_request:
    paths:
      - "examples/eval-scipy/**"
      - "examples/eval-python/**"
      - "examples/eval-pyodide/**"
      - "examples/lambda-feedback-adapter/**"
      - "examples/lambda-feedback-fixtures/**"
      - "scripts/demo-python-examples.sh"
      - "scripts/smoke-python-reactor-handoff.sh"
      - "scripts/verify-python-reactor-artifact.sh"
      - "scripts/python-reactor-artifact.env"
      - "scripts/smoke-pyodide-package-http.sh"
      - "scripts/python-runtime-handoff/**"
      - "tools/lf-bundle-python/**"
      - "build/python-reactor/artifacts/**"
      - "docs/python-runtime-handoff.md"
      - "docs/lambda-feedback-handoff.md"
      - "docs/README.md"
      - "internal/execution/dispatcher*.go"
      - "internal/execution/wasm/agent_python*.go"
      - "internal/execution/wasm/config.go"
      - "internal/execution/supervisor/adapter_rpc*.go"
      - "internal/execution/worker/**"
      - "handler/**"
      - "runtime/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/python-runtimes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime-handoff-contract:
    name: Python runtime handoff contracts (no artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test exact-bundle and binary128 contracts
        run: |
          python3 -m unittest discover \
            -s scripts/python-runtime-handoff/tests \
            -p 'test_*.py' \
            -v
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for filename in (
              "compare_bundles.py",
              "float128_canary.py",
              "validate_float128.py",
          ):
              path = Path("scripts/python-runtime-handoff") / filename
              ast.parse(path.read_text(), filename=str(path))
          print("PASS: handoff Python sources parse without importing the guest canary")
          PY

  agent-python-runtime-e2e:
    name: Agent Python NumPy runtime E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without unrelated LFS objects
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Pull the pinned Agent Python artifact
        run: |
          git lfs pull \
            --include="build/python-reactor/artifacts/agent-python-runtime-numpy-core.wasm" \
            --exclude=""

      - name: Verify the complete producer bundle
        working-directory: build/python-reactor/artifacts
        run: sha256sum --check SHA256SUMS

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Run real snapshot, COW, single-use, binary128, denial, and timeout recovery tests
        env:
          AGENT_PYTHON_RUNTIME_WASM: ${{ github.workspace }}/build/python-reactor/artifacts/agent-python-runtime-numpy-core.wasm
          AGENT_PYTHON_RUNTIME_MANIFEST: ${{ github.workspace }}/build/python-reactor/artifacts/manifest.json
        run: |
          go test ./internal/execution/wasm \
            -run='^TestAgentPythonDispatcher(RealNumPyArtifactCompatibility|RealNumPyCOWRestoresState|SingleUsePreparedRefillsNeverServedCandidates|TimeoutDoesNotPoisonRuntime|RealLambdaFeedbackBundle)$' \
            -count=1 -v -timeout=15m

  pyodide-compatibility:
    name: Pyodide script/package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/eval-pyodide/package-lock.json

      - name: Install Pyodide runner dependencies
        working-directory: examples/eval-pyodide
        run: npm ci

      - name: Test framed stdio bounds
        working-directory: examples/eval-pyodide
        run: npm test

      - name: Run Pyodide script-mode HTTP smoke
        run: scripts/demo-python-examples.sh pyodide-only

      - name: Run Pyodide package-mode HTTP smoke
        run: scripts/smoke-pyodide-package-http.sh

      - name: Upload Pyodide logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyodide-runtime-logs-${{ github.sha }}
          path: .demo-logs/*.log
          if-no-files-found: warn
          retention-days: 14
