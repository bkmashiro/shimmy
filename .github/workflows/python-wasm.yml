name: Python Example Routes

on:
  push:
    branches: [main, feat/wasm-backend]
    paths:
      - "examples/eval-python/**"
      - "examples/eval-numpy/**"
      - "examples/eval-scipy/**"
      - "examples/eval-pyodide/**"
      - "scripts/demo-python-examples.sh"
      - "internal/execution/wasm/python*.go"
      - "internal/execution/wasm/import_scan*.go"
      - "internal/execution/dispatcher*.go"
      - ".github/workflows/python-wasm.yml"
  pull_request:
    paths:
      - "examples/eval-python/**"
      - "examples/eval-numpy/**"
      - "examples/eval-scipy/**"
      - "examples/eval-pyodide/**"
      - "scripts/demo-python-examples.sh"
      - "internal/execution/wasm/python*.go"
      - "internal/execution/wasm/import_scan*.go"
      - "internal/execution/dispatcher*.go"
      - ".github/workflows/python-wasm.yml"
  workflow_dispatch:

jobs:
  python-examples:
    name: Plain Python / NumPy / SciPy examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Setup Node.js for Pyodide/SciPy
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/eval-pyodide/package-lock.json

      - name: Download python-reactor.wasm for NumPy route
        run: |
          mkdir -p internal/execution/wasm/testdata
          curl -fsSL \
            https://github.com/bkmashiro/webassembly-language-runtimes/releases/download/v1.0.11/python-reactor.wasm \
            -o internal/execution/wasm/testdata/python-reactor.wasm

      - name: Run Python example routes
        run: scripts/demo-python-examples.sh

      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-example-logs
          path: .demo-logs/*.log
          retention-days: 14
