name: QEMU Fallback

on:
  push:
    paths:
      - "cmd/shimmy-qemu-*/**"
      - "internal/execution/dispatcher_qemu*"
      - "internal/execution/qemuguest/**"
      - "internal/execution/qemurun/**"
      - "experiments/qemu-fallback/**"
      - ".github/workflows/qemu-fallback.yml"
  pull_request:
    paths:
      - "cmd/shimmy-qemu-*/**"
      - "internal/execution/dispatcher_qemu*"
      - "internal/execution/qemuguest/**"
      - "internal/execution/qemurun/**"
      - "experiments/qemu-fallback/**"
      - ".github/workflows/qemu-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-tcg:
    name: File parity / x86_64 TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Install QEMU and guest image tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            busybox-static \
            dracut-core \
            squashfs-tools \
            linux-image-virtual \
            qemu-system-x86 \
            qemu-utils
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Resolve boot artifacts
        run: |
          kernel=$(readlink -f /boot/vmlinuz)
          test -f "$kernel"
          sudo chmod a+r "$kernel"
          printf 'KERNEL_PATH=%s\n' "$kernel" >> "$GITHUB_ENV"

      - name: Focused tests and static checks
        run: |
          go test -race ./internal/execution/qemurun ./internal/execution/qemuguest
          go test ./cmd/shimmy-qemu-runner ./cmd/shimmy-qemu-guest ./experiments/qemu-fallback/file-evaluator ./experiments/qemu-fallback/rpc-evaluator
          go vet ./internal/execution/qemurun ./internal/execution/qemuguest ./cmd/shimmy-qemu-runner ./cmd/shimmy-qemu-guest
          bash -n experiments/qemu-fallback/build-image.sh experiments/qemu-fallback/smoke-file.sh experiments/qemu-fallback/smoke-rpc.sh experiments/qemu-fallback/run-doc-profile.sh

      - name: Build pinned guest fixture
        env:
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BUILD_DIR: ${{ runner.temp }}/qemu-fallback-image
          KERNEL_PATH: ${{ env.KERNEL_PATH }}
        run: experiments/qemu-fallback/build-image.sh

      - name: Rebuild guest fixture reproducibly
        env:
          OUTPUT_DIR: ${{ runner.temp }}/qemu-fallback-rebuild
          BUILD_DIR: ${{ runner.temp }}/qemu-fallback-image-rebuild
          KERNEL_PATH: ${{ env.KERNEL_PATH }}
        run: |
          experiments/qemu-fallback/build-image.sh
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          first = json.loads(Path("artifacts/qemu-fallback/manifest.json").read_text())
          second = json.loads(Path(os.environ["OUTPUT_DIR"], "manifest.json").read_text())
          for artifact in ("kernel", "initrd", "rootfs"):
              assert first[artifact]["sha256"] == second[artifact]["sha256"], {
                  "artifact": artifact,
                  "first": first[artifact]["sha256"],
                  "second": second[artifact]["sha256"],
              }
          print(json.dumps({"status": "reproducible", "digests": {key: first[key]["sha256"] for key in ("kernel", "initrd", "rootfs")}}, sort_keys=True))
          PY

      - name: Run native versus QEMU public HTTP parity
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BIN_DIR: ${{ runner.temp }}/qemu-fallback-smoke
        run: experiments/qemu-fallback/smoke-file.sh

      - name: Run persistent RPC transport parity
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BIN_DIR: ${{ runner.temp }}/qemu-fallback-rpc-smoke
        run: |
          index=0
          for transport in stdio ipc tcp http ws; do
            RPC_TRANSPORT="$transport" \
              NATIVE_PORT=$((18100 + index * 2)) \
              QEMU_PORT=$((18101 + index * 2)) \
              NATIVE_RPC_PORT=$((19100 + index * 2)) \
              QEMU_RPC_PORT=$((19101 + index * 2)) \
              experiments/qemu-fallback/smoke-rpc.sh
            index=$((index + 1))
          done

      - name: Run lazy RPC one-slot isolation smoke
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/qemu-fallback
          BIN_DIR: ${{ runner.temp }}/qemu-fallback-rpc-smoke
        run: |
          RPC_TRANSPORT=stdio \
            QEMU_RESET_POLICY=lazy \
            NATIVE_PORT=18200 \
            QEMU_PORT=18201 \
            experiments/qemu-fallback/smoke-rpc.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-fallback-tcg-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/qemu-fallback/manifest.json
            artifacts/qemu-fallback/vmlinuz
            artifacts/qemu-fallback/initramfs.img
            artifacts/qemu-fallback/evaluator.squashfs
            experiments/qemu-fallback/sources.lock.json
            ${{ runner.temp }}/qemu-fallback-smoke/native.log
            ${{ runner.temp }}/qemu-fallback-smoke/qemu.log
            ${{ runner.temp }}/qemu-fallback-rpc-smoke/native-rpc-*.log
            ${{ runner.temp }}/qemu-fallback-rpc-smoke/qemu-rpc-*.log
