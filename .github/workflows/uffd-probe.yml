name: userfaultfd Probe (manual)

on:
  workflow_dispatch:

jobs:
  uffd-probe:
    name: userfaultfd availability probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Install Dependencies
        run: go mod download

      - name: Enable unprivileged userfaultfd
        run: sudo sysctl -w vm.unprivileged_userfaultfd=1

      - name: Probe — userfaultfd fd creation (minimal)
        run: |
          go test ./internal/execution/wasm/... \
            -run TestUserfaultfdProbe_FdOnly \
            -v -count=1

      - name: Probe — full userfaultfd + UFFDIO_REGISTER_MODE_WP
        run: |
          go test ./internal/execution/wasm/... \
            -run TestUserfaultfdProbe \
            -v -count=1
        # The test logs "OK" or "FAIL" for WP support and never hard-fails on
        # UFFDIO_REGISTER_MODE_WP absence (some kernel versions lack it).
        # A non-zero exit code indicates a real problem (e.g. fd creation
        # failed on a VM kernel, which should not happen).

      - name: Probe — Go make([]byte) compatibility with uffd WP
        run: |
          go test ./internal/execution/wasm/... \
            -run TestUffdProbe_GoMakeSlice \
            -v -count=1
        # Critical diagnostic: verifies whether wazero's linear memory
        # (allocated via make([]byte, N)) is registerable with
        # UFFDIO_REGISTER_MODE_WP. A failure here means UffdStrategy needs
        # a custom memory allocator workaround.

      - name: UffdStrategy — dirty-page tracking on real WASM module
        run: |
          go test ./internal/execution/wasm/... \
            -run TestUffdStrategy_DirtyPageTracking \
            -v -count=1 -timeout=60s
        # End-to-end test of UffdStrategy on a real wazero module (echo.wasm).
        # Skips gracefully if uffd WP is unavailable.

      - name: UffdStrategy — supervisor integration
        run: |
          go test ./internal/execution/wasm/... \
            -run TestUffdStrategy_SupervisorIntegration \
            -v -count=1 -timeout=60s
        # Integration test: wasmSupervisor with UseUffd=true over 5 requests.

      - name: Benchmark — snapshot restore (full memcpy vs uffd, 64KB + 3MB + 26MB)
        run: |
          go test ./internal/execution/wasm/... \
            -bench=BenchmarkSnapshotRestore \
            -benchtime=3s -count=1 -run=^$ \
            -v 2>&1 | tee bench-results.txt
        # Includes:
        #   BenchmarkSnapshotRestore_FullMemcpy        (echo.wasm, ~64KB)
        #   BenchmarkSnapshotRestore_FullMemcpy_3MB    (3MB baseline)
        #   BenchmarkSnapshotRestore_Uffd_3MB          (3MB, 10% dirty, Restore-only timed)
        #   BenchmarkSnapshotRestore_FullMemcpy_26MB   (26MB baseline = CPython heap)
        #   BenchmarkSnapshotRestore_Uffd_26MB         (26MB, 10% dirty, Restore-only timed)

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt

      - name: Report kernel info
        if: always()
        run: |
          uname -r
          cat /proc/sys/vm/unprivileged_userfaultfd 2>/dev/null || echo "unprivileged_userfaultfd: not present"
